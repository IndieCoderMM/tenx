name: validate

on:
  push:
  pull_request:

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install -g @anthropic-ai/claude-code

      # --strict turns warnings into errors, so a misspelled manifest field or
      # unparseable skill frontmatter fails here instead of silently dropping
      # a component at load time.
      - name: Validate plugins
        run: |
          for dir in */.claude-plugin/plugin.json; do
            plugin="$(dirname "$(dirname "$dir")")"
            echo "::group::$plugin"
            claude plugin validate "./$plugin" --strict
            echo "::endgroup::"
          done
